<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9acb,#dca8ff,#ffd4ef);
}

/* START PAGE */

#start{
text-align:center;
}

#cakePage,
#messagePage{
display:none;
}

#start h1{
font-size:50px;
color: purple;
text-shadow:3px 3px 10px hotpink;
margin-bottom:30px;
  margin-top: 100px;
}

button{

padding:18px 45px;
font-size:24px;
font-weight:bold;

color:white;

background:linear-gradient(145deg,#ff4fa3,#ff80c0);

border:none;

border-radius:50px;

cursor:pointer;

box-shadow:
0 8px #d81b60,
0 15px 25px rgba(255,20,147,.5);

transition:.2s;

animation:glow 2s infinite,bounce 2s infinite;

text-shadow:
2px 2px 4px rgba(0,0,0,.4);

}

button:hover{

transform:translateY(-5px) scale(1.05);

box-shadow:
0 12px #d81b60,
0 20px 30px rgba(255,20,147,.6);

}

button:active{

transform:translateY(6px);

box-shadow:
0 3px #d81b60;

}

@keyframes glow{

0%,100%{

box-shadow:
0 8px #d81b60,
0 0 15px hotpink,
0 0 30px deeppink;

}

50%{

box-shadow:
0 8px #d81b60,
0 0 30px #ff66cc,
0 0 50px #ff1493;

}

}

@keyframes bounce{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-8px);

}

}

/* CAKE PAGE */

#cakePage{
text-align:center;
width:100%;
}

#cakePage h1{
color:pink;
font-size:35px;
  margin-top:100px;
margin-bottom:50px;
text-shadow:3px 3px 8px deeppink;
}

.cake{
width:250px;
height:200px;
margin:auto;
  margin-top: 110px;
  margin-bottom: 50px;
position:relative;
cursor:pointer;
}

/* CANDLES */

.candle{
width:14px;
height:60px;
background:purple;
position:absolute;
top:-55px;
border-radius:5px;
}

.c1{
left:55px;
}

.c2{
left:123px;
}

.c3{
left:191px;
}

.flame{
width:18px;
height:25px;
background: orange;
border-radius:50%;
position:absolute;
left:-2px;
top:-18px;
animation:flicker .5s infinite alternate;
}

@keyframes flicker{

from{
transform:scale(1);
}

to{
transform:scale(1.25);
}

}

/* 3D AGE */

.age3d{

position:absolute;
left:50%;
transform:translateX(-50%);
top:-120px;
display:flex;
gap:5px;
z-index:10;

}

.age3d span{

font-size:55px;
font-weight:bold;
color: purple;

text-shadow:

1px 1px 0 #c58a00,
2px 2px 0 #b57800,
3px 3px 0 #9f6500,
4px 4px 0 #885400,
5px 5px 8px purple;

animation:bounce 1.5s infinite;

}

.age3d span:last-child{

animation-delay:.2s;

}

@keyframes bounce{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-8px);
}

}

/* CAKE */

.layer3{

width:170px;
height:50px;
background:#ffd2e6;
margin:auto;
border-radius:20px;

}

.layer2{

width:220px;
height:60px;
background:#ff9fc8;
margin:auto;
margin-top:-8px;
border-radius:20px;

}

.layer1{

width:260px;
height:70px;
background:#ff6da9;
margin:auto;
margin-top:-8px;
border-radius:20px;

}

/* PHOTO */

.photo{

position:absolute;
width:90px;
height:90px;

border-radius:50%;
overflow:hidden;

left:85px;
top:55px;

border:5px solid white;

}

.photo img{

width:100%;
height:100%;
object-fit:cover;

}

.click{

margin-top:px;
color:purple;
font-size:22px;
animation:updown 1s infinite;

}

@keyframes updown{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-8px);

}

/* MESSAGE PAGE */

#messagePage{

text-align:center;
width:100%;

}

.card{
background:white;
width:360px;
margin:auto;
padding:25px;
border-radius:25px;
box-shadow:0 0 25px hotpink;

}

.card img{

width:180px;
height:180px;

border-radius:50%;

object-fit:cover;

border:6px solid pink;

}

.card h2{

margin-top:15px;

color:#ff1493;

font-size:32px;

}

.card p{

margin-top:15px;

font-size:18px;

line-height:30px;

color:#555;

text-align:center;

}

 </style>

</head>

<body>

<div id="start">

<h1>🎉Happy Birthday🎉</h1>

  <button onclick="showCake()">
🎁 <span class="btnText">CLICK HERE</span> 🎁
</button>
</div>

<div id="cakePage">

<h1>Happy Birthday</h1>

<div class="cake" onclick="blowCandles()">

<div class="age3d">

<span>2</span>

<span>0</span>

</div>

<div class="candle c1">

<div class="flame" id="f1"></div>

</div>

<div class="candle c2">

<div class="flame" id="f2"></div>

</div>

<div class="candle c3">

<div class="flame" id="f3"></div>

</div>

<div class="layer3"></div>

<div class="layer2"></div>

<div class="layer1"></div>

<div class="photo">

<img src="birthday.jpg">

</div>
 
  <audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

</div>

<div class="click">

🕯️ Click the Cake to Blow the Candles

</div>

</div>
  <div id="messagePage">

<div class="card">

<img src="birthday.jpg" alt="Birthday Picture">

<h2>💜 Happy 20th Birthday! 💜</h2>

<p id="typing"></p>

</div>

</div>

<script>

function showCake(){

document.getElementById("start").style.display="none";

document.getElementById("cakePage").style.display="block";
function showCake(){

    document.getElementById("music").play();

    document.getElementById("start").style.display="none";

    document.getElementById("cakePage").style.display="block";

}
}

function blowCandles(){

document.getElementById("f1").style.display="none";
document.getElementById("f2").style.display="none";
document.getElementById("f3").style.display="none";

setTimeout(function(){

document.getElementById("cakePage").style.display="none";

document.getElementById("messagePage").style.display="block";

typeMessage();

createHearts();

createBalloons();

createConfetti();

},1200);

}

const message="Happy 20th Birthday! 🎂💖\n\nWishing you endless happiness, good health, success, laughter, and love. May all your dreams come true and may this year bring wonderful memories. Thank you for being such an amazing person. Enjoy your special day! 🎉🎈💜";

let i=0;

function typeMessage(){

if(i<message.length){

document.getElementById("typing").innerHTML+=message.charAt(i);

i++;

setTimeout(typeMessage,40);

}

}

function createHearts(){

for(let i=0;i<25;i++){

let heart=document.createElement("div");

heart.innerHTML="💖";

heart.style.position="fixed";

heart.style.left=Math.random()*100+"vw";

heart.style.top="100vh";

heart.style.fontSize=(20+Math.random()*20)+"px";

heart.style.animation="floatHeart "+(4+Math.random()*4)+"s linear infinite";

document.body.appendChild(heart);

}

}

function createBalloons(){

for(let i=0;i<15;i++){

let balloon=document.createElement("div");

balloon.innerHTML="🎈";

balloon.style.position="fixed";

balloon.style.left=Math.random()*100+"vw";

balloon.style.bottom="-100px";

balloon.style.fontSize="40px";

balloon.style.animation="balloonUp "+(6+Math.random()*5)+"s linear infinite";

document.body.appendChild(balloon);

}

}

function createConfetti(){

for(let i=0;i<60;i++){

let c=document.createElement("div");

c.innerHTML="✨";

c.style.position="fixed";

c.style.left=Math.random()*100+"vw";

c.style.top="-20px";

c.style.fontSize="20px";

c.style.animation="confetti "+(3+Math.random()*3)+"s linear infinite";

document.body.appendChild(c);

}

}

</script>

<style>

@keyframes floatHeart{

0%{

transform:translateY(0);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh);

opacity:0;

}

}

@keyframes balloonUp{

0%{

transform:translateY(0);

}

100%{

transform:translateY(-130vh);

}

}

@keyframes confetti{

0%{

transform:translateY(0) rotate(0deg);

opacity:1;

}

100%{

transform:translateY(120vh) rotate(720deg);

opacity:0;

}

}

</style>

</body>

</html>
