<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>💜 Birthday Surprise</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
overflow:hidden;
font-family:Arial,sans-serif;
background:
radial-gradient(circle at center,#9b45ff,#4b168c 40%,#160025 80%,#07000f);
color:white;
}

/* =========================
   PAGES
========================= */

.page{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
transform:scale(.85);
transition:1s;
}

.page.active{
opacity:1;
pointer-events:auto;
transform:scale(1);
}


/* =========================
   INTRO PAGE
========================= */

.intro{
text-align:center;
animation:introFloat 3s infinite ease-in-out;
}

.intro-heart{
font-size:85px;
filter:drop-shadow(0 0 25px #d05cff);
}

.intro h1{
margin-top:15px;
font-size:clamp(35px,8vw,65px);
text-shadow:
0 0 10px white,
0 0 30px #b84cff,
0 0 60px #8b2cff;
}

.intro p{
margin:15px;
font-size:20px;
color:#efd8ff;
}

@keyframes introFloat{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-12px);
}

}


/* =========================
   BUTTON
========================= */

.enter{
margin-top:25px;
padding:16px 35px;
border:0;
border-radius:35px;
color:white;
font-size:18px;
font-weight:bold;
background:
linear-gradient(145deg,#c052ff,#6816a8);
box-shadow:
0 8px 0 #37075c,
0 0 30px #a83cff;
cursor:pointer;
transition:.2s;
}

.enter:active{
transform:translateY(7px);
box-shadow:
0 2px 0 #37075c;
}


/* =========================
   TITLES
========================= */

.title{
position:absolute;
top:7%;
text-align:center;
width:100%;
text-shadow:
0 0 10px white,
0 0 25px #b84cff,
0 0 45px #8b2cff;
}

.title h1{
font-size:clamp(30px,7vw,60px);
}

.title p{
margin-top:10px;
color:#efd8ff;
font-size:18px;
}


/* =========================
   COUNTDOWN
========================= */

.countdown{
position:absolute;
top:21%;
font-size:75px;
font-weight:bold;
color:white;
text-shadow:
0 0 10px white,
0 0 30px #c45cff,
0 0 60px #8b2cff;
animation:countPulse 1s infinite;
z-index:20;
}

@keyframes countPulse{

0%{
transform:scale(.7);
opacity:.4;
}

50%{
transform:scale(1.15);
opacity:1;
}

100%{
transform:scale(1);
opacity:.8;
}

}


/* =========================
   CAKE
========================= */

.cake-area{
position:relative;
width:320px;
height:350px;
cursor:pointer;
perspective:1000px;
animation:cakeFloat 4s infinite ease-in-out;
}

@keyframes cakeFloat{

0%,100%{
transform:
translateY(0)
rotateY(-5deg);
}

50%{
transform:
translateY(-15px)
rotateY(5deg);
}

}

.cake{
position:absolute;
width:270px;
height:180px;
left:25px;
bottom:50px;
}

.layer{
position:absolute;
border-radius:20px;
background:
linear-gradient(
90deg,
#421070,
#9d38ed,
#d277ff,
#6d20a2
);
border:2px solid #dfa4ff;
box-shadow:
inset 0 -15px 20px rgba(0,0,0,.3),
0 15px 30px rgba(0,0,0,.5);
}

.layer1{
width:270px;
height:75px;
bottom:0;
}

.layer2{
width:220px;
height:65px;
bottom:55px;
left:25px;
}

.layer3{
width:170px;
height:60px;
bottom:105px;
left:50px;
}

.cream{
position:absolute;
height:18px;
border-radius:50%;
background:#f0c9ff;
box-shadow:0 0 15px #c35cff;
}

.c1{
width:270px;
bottom:58px;
}

.c2{
width:220px;
left:25px;
bottom:108px;
}

.c3{
width:170px;
left:50px;
bottom:153px;
}

.drip{
position:absolute;
width:20px;
height:30px;
background:#e4b0ff;
border-radius:0 0 12px 12px;
}

.d1{
left:40px;
bottom:40px;
}

.d2{
left:100px;
bottom:40px;
height:22px;
}

.d3{
left:160px;
bottom:40px;
height:32px;
}

.d4{
left:220px;
bottom:40px;
height:20px;
}


/* =========================
   CANDLES
========================= */

.candle{
position:absolute;
width:17px;
height:65px;
bottom:160px;
border-radius:8px;
background:
repeating-linear-gradient(
45deg,
#e2a9ff 0 8px,
#7021a5 8px 15px
);
box-shadow:0 0 15px #a83dff;
}

.ca1{
left:70px;
}

.ca2{
left:127px;
}

.ca3{
left:184px;
}

.flame{
position:absolute;
width:22px;
height:32px;
left:-3px;
top:-31px;
border-radius:50%;
background:
linear-gradient(
#fff,
#ed9eff,
#8d2cff
);
box-shadow:
0 0 15px white,
0 0 30px #c45cff;
animation:flame .5s infinite alternate;
}

@keyframes flame{

from{
transform:
scale(1)
rotate(-5deg);
}

to{
transform:
scale(1.15)
rotate(5deg);
}

}

.flame.off{
opacity:0;
transform:scale(0);
transition:.5s;
}


/* =========================
   PLATE
========================= */

.plate{
position:absolute;
bottom:20px;
left:-5px;
width:330px;
height:35px;
border-radius:50%;
background:
linear-gradient(#e3adff,#6b20a1);
box-shadow:0 0 30px #922eff;
transform:rotateX(60deg);
}


/* =========================
   CAKE READY
========================= */

.cake-ready{
animation:
cakeFloat 4s infinite ease-in-out,
cakeGlow 1.5s infinite alternate;
}

@keyframes cakeGlow{

from{
filter:
drop-shadow(0 0 10px #9c36ff);
}

to{
filter:
drop-shadow(0 0 35px #e0a1ff);
}

}


/* =========================
   ENVELOPE
========================= */

.envelope{
position:relative;
width:310px;
height:210px;
cursor:pointer;
filter:
drop-shadow(0 20px 25px rgba(0,0,0,.5));
animation:envFloat 3s infinite ease-in-out;
}

@keyframes envFloat{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-15px);
}

}

.env-body{
position:absolute;
width:100%;
height:100%;
border:3px solid #dda4ff;
border-radius:12px;
background:
linear-gradient(
145deg,
#8e2bca,
#4a0d79
);
box-shadow:
0 0 35px #a53cff;
}

.env-left,
.env-right{
position:absolute;
bottom:0;
width:0;
height:0;
border-bottom:100px solid #651b9b;
}

.env-left{
left:0;
border-right:155px solid transparent;
}

.env-right{
right:0;
border-left:155px solid transparent;
}

.flap{
position:absolute;
top:0;
left:0;
width:0;
height:0;
border-left:155px solid transparent;
border-right:155px solid transparent;
border-top:115px solid #b047e9;
transform-origin:top;
transition:1s;
z-index:5;
}

.envelope.open .flap{
transform:rotateX(180deg);
}

.env-heart{
position:absolute;
left:50%;
top:52%;
transform:translate(-50%,-50%);
font-size:55px;
z-index:8;
filter:
drop-shadow(0 0 15px #f1b8ff);
}


/* =========================
   LETTER
========================= */

.letter-box{
width:min(90%,650px);
height:min(76vh,650px);
padding:10px;
border-radius:25px;
background:
linear-gradient(
145deg,
#a73cff,
#4b087d
);
box-shadow:
0 25px 60px rgba(0,0,0,.6),
0 0 45px #ad3fff;
}

.letter{
width:100%;
height:100%;
overflow:auto;
border-radius:18px;
padding:25px;
background:
linear-gradient(
145deg,
#f7e7ff,
#d9aaf3
);
color:#45105f;
box-shadow:
inset 0 0 30px rgba(110,30,150,.2);
}

.picture{
width:140px;
height:140px;
display:block;
object-fit:cover;
margin:
0 auto 20px;
border-radius:50%;
border:5px solid #a83cff;
box-shadow:
0 0 20px #a83cff,
0 0 40px #d16aff;
}

.letter h2{
text-align:center;
color:#681395;
font-size:30px;
margin-bottom:20px;
}

.typing{
font-size:18px;
line-height:1.8;
white-space:pre-wrap;
}

.signature{
margin-top:25px;
text-align:right;
font-size:20px;
font-weight:bold;
color:#64118c;
}


/* =========================
   PARTICLES
========================= */

.particle{
position:absolute;
width:6px;
height:6px;
border-radius:50%;
background:#e3b1ff;
box-shadow:0 0 12px #b84cff;
animation:
particle 5s linear infinite;
pointer-events:none;
}

@keyframes particle{

from{
transform:translateY(100vh);
opacity:0;
}

20%{
opacity:1;
}

to{
transform:translateY(-100px);
opacity:0;
}

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

.cake-area{
transform:scale(.8);
}

.envelope{
transform:scale(.85);
}

.letter{
padding:20px;
}

.letter h2{
font-size:25px;
}

.typing{
font-size:16px;
}

.countdown{
font-size:65px;
}

}

</style>
</head>


<body>


<!-- =================================
     PAGE 1
================================= -->

<section
class="page active"
id="page1">

<div class="intro">

<div class="intro-heart">
💜
</div>

<h1>
A Special Surprise
</h1>

<p>
Someone prepared something special for you...
</p>

<button
class="enter"
onclick="goToPage(2)">

✨ CLICK HERE TO ENTER ✨

</button>

</div>

</section>



<!-- =================================
     PAGE 2
================================= -->

<section
class="page"
id="page2">

<div class="title">

<h1>
🎂 Happy Birthday!
</h1>

<p id="wishText">
Get ready to make a wish... 💜
</p>

</div>


<div
class="countdown"
id="countdown">

5

</div>


<div
class="cake-area"
id="cakeArea">

<div class="cake">

<div class="layer layer1"></div>
<div class="layer layer2"></div>
<div class="layer layer3"></div>

<div class="cream c1"></div>
<div class="cream c2"></div>
<div class="cream c3"></div>

<div class="drip d1"></div>
<div class="drip d2"></div>
<div class="drip d3"></div>
<div class="drip d4"></div>


<div class="candle ca1">

<div class="flame"></div>

</div>


<div class="candle ca2">

<div class="flame"></div>

</div>


<div class="candle ca3">

<div class="flame"></div>

</div>

</div>


<div class="plate"></div>

</div>


<button
class="enter"
id="wishButton"
disabled>

⏳ WAIT FOR THE WISH...

</button>

</section>



<!-- =================================
     PAGE 3
================================= -->

<section
class="page"
id="page3">

<div class="title">

<h1>
✉️ One More Surprise
</h1>

<p>
There's a special message inside...
</p>

</div>


<div
class="envelope"
id="envelope"
onclick="openEnvelope()">

<div class="env-body"></div>

<div class="env-left"></div>

<div class="env-right"></div>

<div class="flap"></div>

<div class="env-heart">
💜
</div>

</div>


<p
style="
position:absolute;
bottom:12%;
font-size:18px;
color:#efd5ff;
text-shadow:0 0 15px #a83cff;
">

💌 Click the envelope to open

</p>

</section>



<!-- =================================
     PAGE 4
================================= -->

<section
class="page"
id="page4">


<div class="letter-box">

<div class="letter">


<img
src="birthday-picture.jpg"
class="picture"
alt="Birthday Picture">


<h2>
💜 Happy Birthday! 💜
</h2>


<div
class="typing"
id="typing">
</div>


<div class="signature">

With love and best wishes 💜
<br>
Happy Birthday! 🎂✨

</div>


</div>

</div>


<button
class="back"
onclick="goToPage(1)"
style="
position:absolute;
bottom:3%;
padding:12px 25px;
border:0;
border-radius:25px;
background:#7d20b5;
color:white;
font-weight:bold;
box-shadow:0 0 20px #a83cff;
cursor:pointer;
">

🔄 Start Again

</button>

</section>



<script>


/* =================================
   PARTICLES
================================= */

for(let i=0;i<70;i++){

const p=
document.createElement("div");

p.className="particle";

p.style.left=
Math.random()*100+"%";

p.style.animationDelay=
Math.random()*5+"s";

p.style.animationDuration=
(3+Math.random()*5)+"s";

document.body.appendChild(p);

}



/* =================================
   PAGE CHANGE
================================= */

function goToPage(number){

document
.querySelectorAll(".page")
.forEach(page=>{

page.classList.remove("active");

});


document
.getElementById("page"+number)
.classList.add("active");


if(number===2){

startCountdown();

}


if(number===4){

startTyping();

}

}



/* =================================
   COUNTDOWN
================================= */

let countdownStarted=false;

let wishReady=false;

let candlesBlown=false;


function startCountdown(){

if(countdownStarted){

return;

}


countdownStarted=true;


const counter=
document.getElementById("countdown");


const wishText=
document.getElementById("wishText");


const button=
document.getElementById("wishButton");


let number=5;


counter.innerHTML=
number;


const timer=
setInterval(function(){


number--;


if(number>0){

counter.innerHTML=
number;

}


else{

clearInterval(timer);


counter.innerHTML=
"✨";


setTimeout(function(){


counter.innerHTML=
"💜";


wishText.innerHTML=
"✨ MAKE A WISH! ✨";


button.disabled=false;


button.innerHTML=
"🕯️ CLICK TO BLOW THE CANDLES";


wishReady=true;


document
.getElementById("cakeArea")
.classList.add("cake-ready");


},500);

}


},1000);

}



/* =================================
   BLOW CANDLES
================================= */

document
.getElementById("cakeArea")
.addEventListener(
"click",
blowCandles
);


document
.getElementById("wishButton")
.addEventListener(
"click",
blowCandles
);


function blowCandles(){

if(!wishReady){

return;

}


if(candlesBlown){

return;

}


candlesBlown=true;


const flames=
document.querySelectorAll(".flame");


flames.forEach(flame=>{

flame.classList.add("off");

});


document
.getElementById("wishText")
.innerHTML=
"🎉 Your wish has been made! 💜";


document
.getElementById("wishButton")
.innerHTML=
"💌 Opening your surprise...";


createConfetti();


setTimeout(function(){

goToPage(3);

},2000);

}



/* =================================
   CONFETTI
================================= */

function createConfetti(){

for(let i=0;i<70;i++){


const confetti=
document.createElement("div");


confetti.style.position=
"absolute";


confetti.style.width=
"8px";


confetti.style.height=
"14px";


confetti.style.background=
[
"#dca5ff",
"#b64cff",
"#f0d8ff",
"#7625ad",
"#ffffff"
]
[
Math.floor(
Math.random()*5
)
];


confetti.style.left=
"50%";


confetti.style.top=
"45%";


confetti.style.zIndex=
"50";


document
.querySelector(".page.active")
.appendChild(confetti);


const x=
(Math.random()-.5)*800;


const y=
(Math.random()-.5)*600;


confetti.animate(

[

{
transform:
"translate(0,0) rotate(0deg)",
opacity:1
},

{
transform:
`translate(${x}px,${y}px) rotate(720deg)`,
opacity:0
}

],

{

duration:
1500+Math.random()*1500,

easing:
"cubic-bezier(.2,.8,.3,1)"

}

);


setTimeout(()=>{

confetti.remove();

},3000);

}

}



/* =================================
   ENVELOPE
================================= */

function openEnvelope(){

const envelope=
document.getElementById("envelope");


envelope.classList.add("open");


setTimeout(function(){

goToPage(4);

},1000);

}



/* =================================
   TYPING LETTER
================================= */

const message=`
Happy Birthday, Rocelle! 🎂💗🎉

First of all, I just want to wish you a very happy birthday! I hope your special day is filled with happiness, love, laughter, and beautiful memories. You deserve all the good things in life, and I hope this new chapter of your life brings you more reasons to smile.

It's already been 6 months since we became friends, and even though we're in a long-distance friendship, I'm really glad that I got to know you. Distance may keep us from seeing each other in person, but I'm happy that we can still share conversations, stories, and little moments with each other. 🫶🏻

I know this is just a simple birthday message and a little surprise I made for you, but I hope it can make you smile, even just a little. I may not be able to give you a present in person, but I wanted to make something special for you using the things I know how to do.🎁

Thank you for being part of my life for these past 6 months. I hope we can create more memories, share more laughs, and continue being good friends for a long time. Always take care of yourself, okay? Don't forget to enjoy your special day because today is all about you!🥳💕 

Happy birthday again, Rocelle! May all your wishes come true, and may you always find reasons to be happy. Here's to more months of friendship, more memories, and more birthdays to celebrate! 🎂🎈
`;


let typingStarted=false;


function startTyping(){

if(typingStarted){

return;

}


typingStarted=true;


const textBox=
document.getElementById("typing");


let i=0;


function type(){

if(i<message.length){


textBox.innerHTML+=
message.charAt(i);


i++;


setTimeout(
type,
35
);

}

}


type();

}

</script>

</body>
</html>
